# Version bounds: every dep uses `>=floor,<next-major` — caps silent major-release breakage.
[build-system]
requires = ["setuptools>=61,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-mcp"
version = "0.1.0"
description = "Shopify MCP server — Model Context Protocol tools for Shopify Admin API."
# 3.11 floor: the documented setup creates the venv with `python3.11`, CI runs
# only on 3.11, and tooling (e.g. depcheck.py) uses the stdlib `tomllib` added
# in 3.11. The old ">=3.10" was never exercised — this matches the contract to
# reality (Story 10.37).
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "python-dotenv>=1.0.0,<2",
    "requests>=2.31.0,<3",
    "gql[requests]>=3.4.0,<4",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-json-logger>=3,<4",
    "cachetools>=5,<6",
    # HTML-safety detector (Story 10.35 / SEC-M2-sanitizer): nh3 (ammonia/Rust)
    # is the parser-based engine behind tools/_filters.html_safety_findings.
    "nh3>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    # Floor raised 7 -> 9.0.3 (Story 10.40 / SEC-13, SEC-14): every pytest
    # <9.0.3 is vulnerable to CVE-2025-71176 (PYSEC-2026-1845, local
    # DoS/privilege risk via predictable /tmp/pytest-of-{user} dirs on UNIX).
    # pip-audit fails the new CI job on any resolvable 8.x, so the floor must
    # sit above the fix, not just below the next major.
    "pytest>=9.0.3,<10",
    "coverage>=7,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-requests>=2.31,<3",
    "types-cachetools>=5,<7",
]

[project.scripts]
# Installed into the venv's bin/ by `pip install -e .`. Lets Claude Desktop
# launch the server via a single command path (`.venv/bin/shopify-mcp`)
# instead of splitting across Python interpreter + script path.
shopify-mcp = "shopify_mcp.server:main"
# Dependency-drift check (Story 10.37): verifies the current interpreter has
# every dependency pyproject.toml declares. Run after pulling new deps, or
# point it at the interpreter the MCP server launches under to catch the
# boot-crash drift before it happens. Exits non-zero on drift.
shopify-mcp-check-deps = "shopify_mcp.depcheck:main"

# src/ layout under one top-level name (Story 10.47 / FS-3). Replaces the
# py-modules/packages lists that installed six generic top-level names —
# `shopify` among them, which collides with the ShopifyAPI distribution on
# PyPI. Two properties matter here:
#
#   package-dir: the working tree is NOT importable, so `pytest` from the repo
#     root exercises the *installed* distribution. Under the old flat layout a
#     module accidentally left out of `packages` passed the whole CI gate and
#     broke only on a real (non-editable) install.
#   find/where: discovery replaces the hand-maintained lists, so a new
#     sub-package is packaged by existing there rather than by remembering to
#     edit this file. Scoped to src/ so it can never sweep tests/ back in — the
#     regression Story 10.46 (FS-2) closed.
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# Explicit, because the default is `true`: with namespace discovery on, ANY
# directory dropped under src/ becomes an installed top-level package whether
# or not it has an __init__.py — quietly re-opening the collision this story
# closes. Every package here has an __init__.py, so requiring one costs
# nothing and makes adding a top-level name a deliberate act.
namespaces = false

[tool.pytest.ini_options]
# The whole suite lives under tests/ (Story 10.45 / FS-1), so a bare `pytest`
# collects it from anywhere in the repo without naming files.
testpaths = ["tests"]
# The live smoke runners under tests/live/ are excluded from default discovery
# by `collect_ignore` in tests/conftest.py, not by an --ignore here: a relative
# --ignore is resolved against the invocation directory, so it silently stops
# working the moment pytest is run from anywhere but the repo root. See the
# comment in tests/conftest.py.

[tool.coverage.run]
# Single source of truth for what coverage measures — consumed by both
# `coverage run` locally and the CI workflow, so the two can't drift.
# `tests/support/` is intentionally excluded: it holds test doubles exercised
# only through the offline suites, not production code worth gating on.
#
# One name now that everything lives under one package (Story 10.47 / FS-3).
source = ["shopify_mcp"]
# The flat layout expressed "entry points aren't unit tested" by leaving
# `shopify_mcp` (the old entry-point module) out of the `source` list above.
# Folding seven names into one means that carve-out has to be an explicit omit.
# Both modules are verified by being launched — see README's Claude Desktop
# section — not by unit tests. An omit list is an easy place to hide an
# untested module, so its contents are pinned by
# tests/architecture/test_src_layout.py::test_coverage_omits_only_the_entry_points:
# these two and nothing else.
omit = ["*/shopify_mcp/__main__.py", "*/shopify_mcp/server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["aon_mcp_log.txt"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, SIM: simplify, C4: comprehensions, RUF: ruff-specific.
# E501 (long lines) is off: ruff format already wraps what it can, and
# literal strings/URLs that exceed the limit shouldn't fail the build.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B011: asserts are how pytest tests work.
# RUF059: tests consistently unpack `tools, fc = _build(...)`; `fc` (FakeClient)
# is inspected in some tests and not others, and keeping the destructure
# uniform across the suite beats renaming to `_fc` per test.
"test_*.py" = ["B011", "RUF059"]
# validators/naming.py and its tests deal with en-dash separators by design,
# so RUF001/RUF002 (ambiguous-unicode) flagging the en-dashes is noise.
"src/shopify_mcp/validators/naming.py" = ["RUF001", "RUF002"]
"tests/unit/validators/test_naming.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Gate: every def in the `files` list below must have complete param + return
# annotations. Added tools should carry types from the first commit — mypy will
# reject the PR otherwise.
python_version = "3.11"
# One entry now that the whole package lives under src/ (Story 10.47 / FS-3);
# the entry points (server.py, __main__.py) are inside it, so the gate covers
# strictly more than the old per-module list did.
files = ["src/shopify_mcp", "tests/support"]
# src/ is not on sys.path, so mypy needs to be told where the package root is —
# without this it reports every `import shopify_mcp.…` as unresolved.
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = true
# Belt-and-suspenders: if anyone later bypasses the gate with
# `# type: ignore[no-untyped-def]` on a specific def, the body still gets checked.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
